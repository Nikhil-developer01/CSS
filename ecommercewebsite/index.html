<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <link rel="stylesheet" href="style.css">
  <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
  <section class="container">
    <div class="left-section d-flex">
      <div class="insta-logo flex-direction=column">
        <img src="insta.jfif" alt="">
      </div>
      <div class="menu-bar">
        <i class="ri-home-5-line"> <span>Home</span></i>
      </div>
      <div>
        <i class="ri-search-line"> <span>Search</span></i>
      </div>
      <div>
        <i class="ri-compass-3-line"> <span>Explore</span></i>
      </div>
      <div>
        <i class="ri-film-fill"> <span>Reels </span></i>
      </div>
      <div>
        <i class="ri-messenger-line"> <span>Messages</span></i>
      </div>
      <div>
        <i class="ri-poker-hearts-line"> <span>Notification</span></i>
      </div>
      <div>
        <i class="ri-add-box-line"> <span>Create</span></i>
      </div>
      <div>
        <b>Profile</b>
      </div>
      <div>
        <i class="ri-menu-line"> <span>More</span></i>
      </div>
    </div>
    <div class="right-section d-flex">
      <div>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRG9mFgMjtHbBhG6EipfKh9z9lLSyb72oGrK0qItRG3aoyPafQrZRvI9f6U&s=10" alt="">
      </div>
    </div>
  </section>
  
</body>
</html>
